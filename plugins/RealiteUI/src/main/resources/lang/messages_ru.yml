format:
  prefix: "<gray>[UI]</gray> "

ui:
  common:
    back: "<yellow>Назад</yellow>"
    close: "<red>Закрыть</red>"
    next: "<green>Далее</green>"
    prev: "<green>Назад</green>"
    confirm: "<green>Подтвердить</green>"
    cancel: "<red>Отмена</red>"
    coming_soon: "<gray>Скоро.</gray>"
  command:
    player_only: "<red>Только для игроков.</red>"
  hud:
    bossbar: "<yellow>{provider}</yellow> <gray>{current}/{max}</gray>"
    actionbar: "<yellow>{provider}</yellow> <gray>{current}/{max}</gray>"
  provider:
    familiars:
      status: "<yellow>Фамильяр</yellow>"
  familiars:
    unavailable: "<red>Управление фамильярами недоступно.</red>"
    empty: "<gray>Питомцев нет.</gray>"
    action:
      failed: "<red>Действие не выполнено.</red>"
    state:
      idle: "<gray>приручен</gray>"
      summoned: "<green>призван</green>"
      cooldown: "<yellow>перезарядка</yellow>"
    hud:
      hint: "<yellow>Открыть управление</yellow>"
      actionbar: "<yellow>Фамильяры</yellow> <gray>{count}/{max}</gray> <white>{name}</white> <gray>Lv {level}</gray> <aqua>{role}</aqua> <red>{hp}</red> <gray>{distance}</gray> <dark_gray>·</dark_gray> <yellow>{hint}</yellow>"
      actionbar_empty: "<yellow>Фамильяры</yellow> <gray>{count}/{max}</gray> <dark_gray>·</dark_gray> <yellow>{hint}</yellow>"
    manager:
      title: "<gold>Управление фамильярами</gold>"
      card:
        name: "<white>{name}</white> <gray>ур. {level}</gray>"
        mob: "<gray>Тип: <white>{mob}</white></gray>"
        role: "<gray>Роль: <white>{role}</white></gray>"
        state: "<gray>Состояние: <white>{state}</white></gray>"
        active: "<green>Активный</green>"
      action:
        summon: "<green>Призвать</green>"
        dismiss: "<red>Отпустить</red>"
        set_active: "<yellow>Сделать активным</yellow>"
        details: "<aqua>Детали</aqua>"
        rename: "<gray>Переименовать</gray>"
    details:
      title: "<gold>Фамильяр: {name}</gold>"
      missing: "<red>Фамильяр не найден.</red>"
      stats:
        title: "<yellow>Статы</yellow>"
        empty: "<gray>Нет данных.</gray>"
        entry: "<gray>{stat}: <white>{value}</white></gray>"
      progress:
        title: "<yellow>Прогресс</yellow>"
        level: "<gray>Уровень: <white>{level}</white></gray>"
        xp: "<gray>Опыт: <white>{xp}</white>/<white>{max}</white></gray>"
      talents:
        title: "<yellow>Таланты</yellow>"
        empty: "<gray>Пока пусто.</gray>"
        entry: "<gray>{talent}</gray>"
      inventory:
        title: "<yellow>Инвентарь</yellow>"
        empty: "<gray>Пусто.</gray>"
        entry: "<gray>{item}</gray>"
  menu:
    filler: "<gray> </gray>"
    page: "<gray>Страница <white>{page}</white>/<white>{pages}</white></gray>"
  settings:
    title: "<gold>Настройки интерфейса</gold>"
    bossbar: "<yellow>BossBar слот</yellow>"
    actionbar: "<yellow>ActionBar слот</yellow>"
    choose: "<gray>Нажмите, чтобы выбрать</gray>"
    current: "<gray>Текущий: <white>{provider}</white></gray>"
    select_title: "<gold>Выбор провайдера</gold>"
    provider_item: "<white>{provider}</white>"
    selected: "<green>Выбрано</green>"
    none: "<red>Не показывать</red>"
  action:
    unavailable: "<gray>Недоступно</gray>"
