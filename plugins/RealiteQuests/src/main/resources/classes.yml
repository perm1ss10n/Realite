classes:
  WANDERER:
    title: "Путь странника"
    pages:
      - "&6Странник&7 — путь тех, кто ищет дорогу и своё предназначение."
      - "&7Ты учишься ориентироваться в мире и слышать зов новых дорог."
    introQuestId: "wanderer_initiation"
    postIntroQuests:
      - "common_gear_up"
      - "common_settle_in_city"

  WARRIOR:
    title: "Путь воина"
    pages:
      - "&6Воин&7 рождается в решимости защищать и побеждать."
      - "&7Твоё оружие — дисциплина, а твой путь — испытания и честь."
    introQuestId: "warrior_initiation"
    postIntroQuests:
      - "common_gear_up"
      - "common_settle_in_city"

  ALCHEMIST:
    title: "Путь алхимика"
    pages:
      - "&6Алхимик&7 изучает мир через зелья, эссенции и тайные формулы."
      - "&7Каждый опыт приближает к мастерству и новым открытиям."
    introQuestId: "alchemist_initiation"
    postIntroQuests:
      - "common_gear_up"
      - "common_settle_in_city"

  MINER:
    title: "Путь шахтёра"
    pages:
      - "&6Шахтёр&7 знает цену труду и тишине глубин."
      - "&7Под землёй рождаются ресурсы, а в тебе — стойкость."
    introQuestId: "miner_initiation"
    postIntroQuests:
      - "common_gear_up"
      - "common_settle_in_city"

  MERCHANT:
