      - "&7На рынке важны честность, хватка и умение договариваться."
    introQuestId: "merchant_initiation"
    postIntroQuests:
      - "common_gear_up"
      - "common_settle_in_city"

  ARCHER:
    title: "Путь лучника"
    pages:
      - "&6Лучник&7 полагается на меткость, выдержку и лёгкость шагов."
      - "&7Твоя цель — далеко, но рука всегда уверена."
    introQuestId: "archer_initiation"
    postIntroQuests:
      - "common_gear_up"
      - "common_settle_in_city"
