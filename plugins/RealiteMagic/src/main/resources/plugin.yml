name: RealiteMagic
version: 1.0.0
main: ru.realite.magic.RealiteMagicPlugin
api-version: "1.21"

commands:
  rmagic:
    description: "RealiteMagic command"
    usage: "/rmagic"

softdepend:
  - RealiteItems
  - RealiteCore
  - RealiteClasses

permissions:
  realite.magic.admin:
    description: "Base permission for RealiteMagic admin commands"
    default: op
