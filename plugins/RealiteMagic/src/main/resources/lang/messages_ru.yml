format:
  prefix: "&d[Magic]&r "

magic:
  enabled: "{prefix}&aПлагин RealiteMagic включён."
  command:
    usage:
      root: "&eИспользование: &f/rmagic <menu|spell|mana>"
      spell: "&eИспользование: &f/rmagic spell <select|clear|get> [player] [spellId]"
    only-player: "{prefix}&cКоманда доступна только игрокам."
    spell:
      selected_self: "&aВы выбрали заклинание: &f{spell}"
      selected_other: "&aИгрок &f{player}&a выбрал заклинание: &f{spell}"
      cleared_self: "&eВы сбросили выбранное заклинание."
      cleared_other: "&eВы сбросили выбранное заклинание у &f{player}&e."
      get_self: "&eТекущее заклинание: &f{spell}"
      get_other: "&eТекущее заклинание у &f{player}&e: &f{spell}"
      get_empty_self: "&eЗаклинание не выбрано."
      get_empty_other: "&eУ &f{player}&e нет выбранного заклинания."
      unknown_spell: "&cНеизвестное заклинание: &f{spellId}"
      locked: "&cНедоступно: &f{reason}"
    errors:
      no_permission: "&cНет прав."
      player_not_found: "&cИгрок не найден: &f{player}"
