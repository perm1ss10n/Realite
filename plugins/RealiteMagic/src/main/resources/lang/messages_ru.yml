format:
  prefix: "&d[Magic]&r "

magic:
  enabled: "{prefix}&aПлагин RealiteMagic включён."
  cmd:
    usage: "&eИспользование: &f/rmagic <menu|spell|spells|mana>"
    player_not_found: "&cИгрок не найден: &f{player}"
    spell:
      usage: "&eИспользование: &f/rmagic spell <give|remove|list|select|clear> <player> [spellId]"
      give:
        ok: "&aВыдали заклинание &f{spell}&a игроку &f{player}&a."
      remove:
        ok: "&eУдалили заклинание &f{spell}&e у &f{player}&e."
      select:
        ok: "&aВыбрали заклинание &f{spell}&a для &f{player}&a."
      list:
        header: "&eЗаклинания игрока &f{player}&e:"
        entry: "&7- {spell} &8({id})"
    spells:
      usage: "&eИспользование: &f/rmagic spells <reload|validate>"
      reload:
        ok: "&aЗагружено &f{count}&a, ошибок &f{errors}&a."
      validate:
        ok: "&aПроверено &f{count}&a, ошибок &f{errors}&a."
      errors:
        header: "&eОшибки загрузки заклинаний:"
        entry: "&7- {file}: {error}"
        missing_section: "&cОтсутствует секция spell."
        invalid_id: "&cНекорректный id."
        missing_type: "&cНе указан тип."
        unknown_type: "&cНеизвестный тип: &f{type}"
        missing_name_desc: "&cНе указаны nameKey/descKey."
        invalid_numbers: "&cНекорректные числовые значения."
        duplicate_id: "&cДублирующийся id: &f{id}"
        invalid_icon_material: "&eНеверный icon.material: &f{material}"
        invalid_gui_slot: "&eНеверный gui.slot: &f{slot}"
        invalid_default_icon_material: "&eНеверный defaultSpellIconMaterial: &f{material}"
        folder_create_failed: "&cНе удалось создать папку: &f{path}"
        unknown: "&cНеизвестная ошибка."
      no_errors: "&aОшибок не найдено."
  command:
    usage:
      root: "&eИспользование: &f/rmagic <menu|spell|spells|mana>"
      spell: "&eИспользование: &f/rmagic spell <select|clear|get> [player] [spellId]"
    only-player: "{prefix}&cКоманда доступна только игрокам."
    spell:
      selected_self: "&aВы выбрали заклинание: &f{spell}"
      selected_other: "&aИгрок &f{player}&a выбрал заклинание: &f{spell}"
      cleared_self: "&eВы сбросили выбранное заклинание."
      cleared_other: "&eВы сбросили выбранное заклинание у &f{player}&e."
      get_self: "&eТекущее заклинание: &f{spell}"
      get_other: "&eТекущее заклинание у &f{player}&e: &f{spell}"
      get_empty_self: "&eЗаклинание не выбрано."
      get_empty_other: "&eУ &f{player}&e нет выбранного заклинания."
      unknown_spell: "&cНеизвестное заклинание: &f{spellId}"
      locked: "&cНедоступно: &f{reason}"
    errors:
      no_permission: "&cНет прав."
      player_not_found: "&cИгрок не найден: &f{player}"
      only_players: "&cКоманда доступна только игрокам."
  need-focus: "{prefix}&cНужен фокус-предмет для каста."
  menu:
    title: "&5Выбор заклинания"
    spell_select:
      title: "&5Выбор заклинания"
      no_spells: "&cНет доступных заклинаний."
      selected: "&aВыбрано: &f{spell}"
      locked: "&cНедоступно: &f{reason}"
    mana-line: "&7Мана: &b{mana}"
    cooldown-line: "&7КД: &b{cooldown}&7с"
    selected: "&aВыбрано"
    unavailable: "&cНедоступно"
    common:
      filler: " "
      close: "&cЗакрыть"
      back: "&eНазад"
  gui:
    title: "&5Книга заклинаний"
    spell:
      selected: "&aВыбрано"
      locked: "&cНе изучено"
    hint:
      select: "&7ЛКМ: выбрать"
  error:
    no_selected_spell: "&cЗаклинание не выбрано. Открой &f/rmagic&c и выбери."
    cannot_select_spell: "&cТы не можешь выбрать это заклинание: &f{reason}"
    not_enough_mana: "&cНедостаточно маны: &f{current}&c/&f{need}"
    on_cooldown: "&cПерезарядка: &f{seconds}&cс"
    need_focus: "&cНужен магический фокус в руке."
  cast:
    no_selected: "&cТы не выбрал заклинание."
    cooldown: "&cПодожди {time}с."
    no_mana: "&cНе хватает маны: &f{mana}"
    no_target: "&cНет подходящей цели."
    missing_item: "&cНужен предмет: &f{item}"
    wrong_item: "&cДля этого заклинания нужен предмет: &f{item}"
    give_item: "&aПолучено: &f{item}&a x{amount}"
    items_bridge_missing: "RealiteItems не подключен, requiredItemId не проверяется."
  storage:
    load_fail: "&cНе удалось загрузить данные заклинаний."
    save_fail: "&cНе удалось сохранить данные заклинаний."
  mana:
    actionbar: "{prefix}&dМана: &b{mana}&7/&b{max}"
  spell:
    unknown: "{prefix}&cНеизвестное заклинание: &f{spell}"
    unlock:
      ok: "{prefix}&aВы изучили заклинание: &f{spell}"
      already: "{prefix}&eЗаклинание уже изучено: &f{spell}"
      from_item:
        ok: "{prefix}&aТы изучил: &f{spell}"
        denied: "{prefix}&cНельзя изучить: &f{reason}"
        already: "{prefix}&eУже изучено: &f{spell}"
        invalid_scroll: "{prefix}&cСвиток повреждён."
    select:
      ok: "{prefix}&aВы выбрали заклинание: &f{spell}"
      not_learned: "{prefix}&cЗаклинание не изучено: &f{spell}"
    revoke:
      ok: "{prefix}&eЗаклинание забыто: &f{spell}"
    lore:
      description: "&7{desc}"
      mana: "&bМана: &f{mana}"
      cooldown: "&eКД: &f{seconds}с"
      range: "&aДальность: &f{range}"
      damage: "&cУрон: &f{damage}"
      selected: "&a✔ Выбрано"
      locked_reason: "&cТребуется: &f{reason}"
      requirements:
        class: "Класс: {class}"
        evolution: "Эволюция: {evolution}"
        separator: ", "
    cast: "{prefix}&dВы использовали: &f{name}"
    selected: "{prefix}&dАктивное заклинание: &f{name}"
    requirements:
      class: "{prefix}&cТребуется класс: &f{class}"
      evolution: "{prefix}&cТребуется эволюция: &f{evolution}"
    warlock_ray:
      name: "&5Луч Тьмы"
      desc: "&7Пронзающий луч наносит магический урон."
  require:
    missing_class_module: "&cМодуль классов недоступен."
    no_class_selected: "&cКласс не выбран."
    class_mismatch: "&cТребуется класс: &f{class}"
    no_evolution: "&cТребуется эволюция: &f{evolution}"
    evolution_mismatch: "&cТребуется эволюция: &f{evolution}"
    item_missing: "&cНужен предмет: &f{item}"
    missing_items_module: "&cМодуль предметов недоступен."
