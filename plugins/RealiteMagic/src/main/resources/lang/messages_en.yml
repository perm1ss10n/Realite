format:
  prefix: "&d[Magic]&r "

magic:
  enabled: "{prefix}&aRealiteMagic plugin enabled."
  cmd:
    usage: "&eUsage: &f/rmagic <menu|spell|spells|mana|debug>"
    player_not_found: "&cPlayer not found: &f{player}"
    debug:
      usage: "&eUsage: &f/rmagic debug <on|off|cast|stats> [player]"
      on: "&aDebug enabled."
      off: "&eDebug disabled."
      player_on: "&aCast debug enabled for &f{player}&a."
      player_off: "&eCast debug disabled for &f{player}&e."
      cast: "&7[Debug] {player} spell={spell} target={target} mana={mana} gcd={globalCooldown} cd={spellCooldown} reason={reason}"
      stats:
        header: "&eDebug stats ({type}):"
        entry: "&7- {key}: {value}"
    spell:
      usage: "&eUsage: &f/rmagic spell <give|remove|list|select|clear> <player> [spellId]"
      give:
        ok: "&aGave spell &f{spell}&a to &f{player}&a."
      remove:
        ok: "&eRemoved spell &f{spell}&e from &f{player}&e."
      select:
        ok: "&aSelected spell &f{spell}&a for &f{player}&a."
      list:
        header: "&eSpells for &f{player}&e:"
        entry: "&7- {spell} &8({id})"
    spells:
      usage: "&eUsage: &f/rmagic spells <reload|validate>"
      reload:
        ok: "&aLoaded &f{count}&a, errors &f{errors}&a."
      validate:
        ok: "&aValidated &f{count}&a, errors &f{errors}&a."
      errors:
        header: "&eSpell load errors:"
        entry: "&7- {file}: {error}"
        schema: "&7- {file}: {path}: {error}"
        missing_field: "&cMissing field: {field}"
        invalid_value: "&cInvalid value for {field}: {value}"
        unknown_effect: "&cUnknown effect type: {type}"
        missing_section: "&cMissing spell section."
        invalid_id: "&cInvalid id."
        missing_type: "&cMissing type."
        unknown_type: "&cUnknown type: &f{type}"
        missing_name_desc: "&cMissing nameKey/descKey."
        invalid_numbers: "&cInvalid numeric values."
        duplicate_id: "&cDuplicate id: &f{id}"
        invalid_icon_material: "&eInvalid icon.material: &f{material}"
        invalid_gui_slot: "&eInvalid gui.slot: &f{slot}"
        invalid_default_icon_material: "&eInvalid defaultSpellIconMaterial: &f{material}"
        folder_create_failed: "&cFailed to create folder: &f{path}"
        effect_invalid_entry: "&cEffect #{index}: invalid entry."
        effect_missing_type: "&cEffect #{index}: missing type."
        effect_unknown_type: "&cEffect #{index}: unknown type {type}."
        effect_missing_param: "&cEffect #{index} ({type}): missing param {param}."
        effect_invalid_param: "&cEffect #{index} ({type}): invalid {param} = {value}."
        effect_target_mismatch: "&cEffect #{index} ({type}): target {target} does not match spell target {spellTarget}."
        unknown: "&cUnknown error."
      no_errors: "&aNo errors found."
  command:
    usage:
      root: "&eUsage: &f/rmagic <menu|spell|spells|mana|debug>"
      spell: "&eUsage: &f/rmagic spell <select|clear|get> [player] [spellId]"
    only-player: "{prefix}&cCommand is only for players."
    spell:
      selected_self: "&aYou selected a spell: &f{spell}"
      selected_other: "&aPlayer &f{player}&a selected a spell: &f{spell}"
      cleared_self: "&eYou cleared the selected spell."
      cleared_other: "&eYou cleared the selected spell for &f{player}&e."
      get_self: "&eCurrent spell: &f{spell}"
      get_other: "&eCurrent spell for &f{player}&e: &f{spell}"
      get_empty_self: "&eNo spell selected."
      get_empty_other: "&ePlayer &f{player}&e has no selected spell."
      unknown_spell: "&cUnknown spell: &f{spellId}"
      locked: "&cUnavailable: &f{reason}"
    errors:
      no_permission: "&cNo permission."
      player_not_found: "&cPlayer not found: &f{player}"
      only_players: "&cCommand is only for players."
  need-focus: "{prefix}&cYou need a focus item to cast."
  menu:
    title: "&5Select spell"
    spell_select:
      title: "&5Select spell"
      no_spells: "&cNo spells available."
      selected: "&aSelected: &f{spell}"
      locked: "&cUnavailable: &f{reason}"
    mana-line: "&7Mana: &b{mana}"
    cooldown-line: "&7Cooldown: &b{cooldown}&7s"
    selected: "&aSelected"
    unavailable: "&cUnavailable"
    common:
      filler: " "
      close: "&cClose"
      back: "&eBack"
  gui:
    title: "&5Spellbook"
    spell:
      selected: "&aSelected"
      locked: "&cNot learned"
    hint:
      select: "&7LMB: select"
  error:
    no_selected_spell: "&cNo spell selected. Open &f/rmagic&c and choose one."
    cannot_select_spell: "&cYou cannot select this spell: &f{reason}"
    not_enough_mana: "&cNot enough mana: &f{current}&c/&f{need}"
    on_cooldown: "&cCooldown: &f{seconds}&c s"
    need_focus: "&cYou need a magic focus in hand."
  cast:
    no_selected: "&cNo spell selected."
    cooldown: "&cWait {time}s."
    no_mana: "&cNot enough mana: &f{mana}"
    no_target: "&cNo valid target."
    missing_item: "&cRequired item: &f{item}"
    wrong_item: "&cThis spell requires item: &f{item}"
    give_item: "&aReceived: &f{item}&a x{amount}"
    items_bridge_missing: "RealiteItems is not connected, requiredItemId is not checked."
  storage:
    load_fail: "&cFailed to load spell data."
    save_fail: "&cFailed to save spell data."
  mana:
    actionbar: "{prefix}&dMana: &b{mana}&7/&b{max}"
  spell:
    unknown: "{prefix}&cUnknown spell: &f{spell}"
    unlock:
      ok: "{prefix}&aYou learned a spell: &f{spell}"
      already: "{prefix}&eSpell already learned: &f{spell}"
      from_item:
        ok: "{prefix}&aYou learned: &f{spell}"
        denied: "{prefix}&cCannot learn: &f{reason}"
        already: "{prefix}&eAlready learned: &f{spell}"
        invalid_scroll: "{prefix}&cThe scroll is damaged."
    select:
      ok: "{prefix}&aSelected spell: &f{spell}"
      not_learned: "{prefix}&cYou haven't learned this spell: &f{spell}"
    revoke:
      ok: "{prefix}&eSpell revoked: &f{spell}"
    lore:
      description: "&7{desc}"
      mana: "&bMana: &f{mana}"
      cooldown: "&eCooldown: &f{seconds}s"
      range: "&aRange: &f{range}"
      damage: "&cDamage: &f{damage}"
      selected: "&a✔ Selected"
      locked_reason: "&cRequires: &f{reason}"
      requirements:
        class: "Class: {class}"
        evolution: "Evolution: {evolution}"
        separator: ", "
    cast: "{prefix}&dYou cast: &f{name}"
    selected: "{prefix}&dActive spell: &f{name}"
    requirements:
      class: "{prefix}&cRequired class: &f{class}"
      evolution: "{prefix}&cRequired evolution: &f{evolution}"
    warlock_ray:
      name: "&5Shadow Ray"
      desc: "&7A piercing ray that deals magic damage."
  require:
    missing_class_module: "&cClass module is unavailable."
    no_class_selected: "&cYou have no class selected."
    class_mismatch: "&cRequired class: &f{class}"
    no_evolution: "&cRequired evolution: &f{evolution}"
    evolution_mismatch: "&cRequired evolution: &f{evolution}"
    item_missing: "&cRequired item: &f{item}"
    missing_items_module: "&cItems module is unavailable."
