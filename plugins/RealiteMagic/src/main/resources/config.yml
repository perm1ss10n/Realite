# Основной язык сообщений (ru/en)
lang: "ru"

mana:
  maxDefault: 100.0
  regenPerSecond: 2.0
  regenInCombatMultiplier: 0.5
  combatTimeoutSeconds: 10.0

cooldowns:
  globalCastTicks: 10

casting:
  requireFocus: true
  allowedFocusItemIds:
    - "warlock_grimoire"
  manaFormat: "0.0"
  cooldownFormat: "0.0"
  giveItemMessage: true

schools:
  enabled: true
  conflictWindowSeconds: 10
  modifiers:
    WARLOCK:
      damageMultiplier: 1.0
      manaMultiplier: 1.0
      cooldownMultiplier: 1.0
    FIRE:
      damageMultiplier: 1.1
      manaMultiplier: 1.05
      cooldownMultiplier: 1.0
  conflicts:
    - a: HOLY
      b: WARLOCK
  classBonuses:
    warlock:
      school: WARLOCK
      damageMultiplier: 1.15
      manaMultiplier: 0.95

mastery:
  enabled: true
  maxLevel: 10
  xp:
    castSuccess: 1
    hit: 2
    kill: 5
  progression:
    mode: LINEAR
    linear:
      base: 20
      perLevel: 10
    table:
      - 20
      - 30
      - 45
      - 60
      - 80
      - 105
      - 135
      - 170
      - 210
      - 255
  modifiers:
    perLevel:
      damageMultiplier: 0.02
      manaMultiplier: -0.01
      cooldownMultiplier: -0.01

hud:
  enabled: true
  useActionBar: true
  showOnSlotChange: true
  showFailReasons: true
  showSuccess: false
  throttleMs: 250

requirements:
  failWhenItemsUnavailable: true

menu:
  spellSelect:
    titleKey: "magic.gui.title"
    size: 54
    closeOnSelect: true
    defaultSpellIconMaterial: "PAPER"
    manaFormat: "0.0"
    cooldownFormat: "0.0"
    rangeFormat: "0.0"
    damageFormat: "0.0"
    slots:
      - 10
      - 11
      - 12
      - 13
      - 14
      - 15
      - 16
      - 19
      - 20
      - 21
      - 22
      - 23
      - 24
      - 25
      - 28
      - 29
      - 30
      - 31
      - 32
      - 33
      - 34
    filler:
      enabled: true
      material: "BLACK_STAINED_GLASS_PANE"
      nameKey: "magic.menu.common.filler"
    buttons:
      close:
        enabled: true
        slot: 49
        material: "BARRIER"
        nameKey: "magic.menu.common.close"
    noSpells:
      material: "PAPER"
