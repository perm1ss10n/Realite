# Основной язык сообщений (ru/en)
lang: "ru"

mana:
  maxDefault: 100.0
  regenPerSecond: 2.0
  regenInCombatMultiplier: 0.5
  combatTimeoutSeconds: 10.0

cooldowns:
  globalCastTicks: 10

balance:
  tiers:
    T1:
      mana: 6
      cooldown: 2.0
      damage: 4.0
    T2:
      mana: 10
      cooldown: 4.0
      damage: 7.0
    T3:
      mana: 16
      cooldown: 7.0
      damage: 11.0
    T4:
      mana: 24
      cooldown: 12.0
      damage: 16.0

casting:
  requireFocus: true
  allowedFocusItemIds:
    - "warlock_grimoire"
    - "magic_staff_basic"
  manaFormat: "0.0"
  cooldownFormat: "0.0"
  giveItemMessage: true

limits:
  maxAoeTargets: 16
  maxChainTargets: 8
  maxBeamDistance: 30
  maxProjectileDistance: 40

pve:
  enabled: true

  defaults:
    damageTakenMultiplier: 1.0
    schoolDamageTaken:
      WARLOCK: 1.0
      FIRE: 1.0
      FROST: 1.0
      HOLY: 1.0

  byEntityType:
    SKELETON:
      schoolDamageTaken:
        HOLY: 0.8
        FIRE: 1.1
      immunePotionEffects: [SLOW]

  byTag:
    boss:
      damageTakenMultiplier: 0.7
      schoolDamageTaken:
        WARLOCK: 0.6
        HOLY: 1.2
      immuneEffects: [knockback, pull]
      maxHitsPerWindow: 6
      windowMs: 2000

    elite:
      damageTakenMultiplier: 0.85
      maxHitsPerWindow: 10
      windowMs: 2000

staff:
  enabled: true
  requireStaff: true
  consumeChargesOnCast: true
  chargesCostDefault: 1
  allowOffhand: true
  recharge:
    enabled: true
    itemId: "magic_charge_crystal"
    addCharges: 10

runes:
  strictSchoolMatch: false

schools:
  enabled: true
  conflictWindowSeconds: 10
  modifiers:
    WARLOCK:
      damageMultiplier: 1.0
      manaMultiplier: 1.0
      cooldownMultiplier: 1.0
    FIRE:
      damageMultiplier: 1.1
      manaMultiplier: 1.05
      cooldownMultiplier: 1.0
  conflicts:
    - a: HOLY
      b: WARLOCK
  classBonuses:
    warlock:
      school: WARLOCK
      damageMultiplier: 1.15
      manaMultiplier: 0.95

regions:
  enabled: true

  default:
    allowCast: true

  byType:
    CITY:
      allowCast: true
    PLOT:
      allowCast: true

  overrides:
    spawn:
      allowCast: false
      messageKey: magic.region.denied.spawn
    arena:
      allowCast: true
      schoolWhitelist: [FIRE, ARCANE]
      modifiers:
        cooldownMultiplier: 0.85

  schoolModifiers:
    temple:
      HOLY:
        damageMultiplier: 1.2
      WARLOCK:
        damageMultiplier: 0.8

  byWorld:
    world_nether:
      allowCast: true
    spawn_world:
      allowCast: false

guilds:
  enabled: true
  bonuses:
    WARLOCK:
      damageMultiplier: 1.05
    FIRE:
      cooldownMultiplier: 0.95
  rankBonuses:
    leader:
      manaMultiplier: 0.9

mastery:
  enabled: true
  maxLevel: 10
  xp:
    castSuccess: 1
    hit: 2
    kill: 5
  progression:
    mode: LINEAR
    linear:
      base: 20
      perLevel: 10
    table:
      - 20
      - 30
      - 45
      - 60
      - 80
      - 105
      - 135
      - 170
      - 210
      - 255
  modifiers:
    perLevel:
      damageMultiplier: 0.02
      manaMultiplier: -0.01
      cooldownMultiplier: -0.01

hud:
  enabled: true
  useActionBar: true
  showOnSlotChange: true
  showFailReasons: true
  showSuccess: false
  throttleMs: 250

requirements:
  failWhenItemsUnavailable: true

reagents:
  enabled: true
  failWhenItemsUnavailable: true
  defaultsBySchool:
    WARLOCK:
      - itemId: "magic_ash"
        amount: 1
    FIRE:
      - itemId: "fire_powder"
        amount: 1
    FROST:
      - itemId: "frost_dust"
        amount: 1
    HOLY:
      - itemId: "holy_salt"
        amount: 1

economy:
  enabled: true
  failWhenUnavailable: false
  tax:
    enabled: true
    cityCut: 0.20
    guildCut: 0.10

crafting:
  enabled: true
  recipes:
    charge_crystal:
      enabled: true
      resultItemId: "magic_charge_crystal"
      shape:
        - "AGA"
        - "GCG"
        - "AGA"
      ingredients:
        A: "AMETHYST_SHARD"
        G: "GLOWSTONE_DUST"
        C: "DIAMOND"
    fire_rune:
      enabled: true
      resultItemId: "magic_rune_fire"
      shape:
        - " B "
        - "BPB"
        - " B "
      ingredients:
        B: "BLAZE_POWDER"
        P: "PAPER"

menu:
  spellSelect:
    titleKey: "magic.gui.title"
    size: 54
    closeOnSelect: true
    defaultSpellIconMaterial: "PAPER"
    manaFormat: "0.0"
    cooldownFormat: "0.0"
    rangeFormat: "0.0"
    damageFormat: "0.0"
    slots:
      - 10
      - 11
      - 12
      - 13
      - 14
      - 15
      - 16
      - 19
      - 20
      - 21
      - 22
      - 23
      - 24
      - 25
      - 28
      - 29
      - 30
      - 31
      - 32
      - 33
      - 34
    filler:
      enabled: true
      material: "BLACK_STAINED_GLASS_PANE"
      nameKey: "magic.menu.common.filler"
    buttons:
      close:
        enabled: true
        slot: 49
        material: "BARRIER"
        nameKey: "magic.menu.common.close"
    noSpells:
      material: "PAPER"
