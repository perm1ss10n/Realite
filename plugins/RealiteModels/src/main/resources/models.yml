entity_models:
  unicorn_horse:
    entity: "minecraft:horse"
    when:
      name_contains: "[Unicorn]"
    apply:
      horse:
        color: "WHITE"
        style: "NONE"
      attachment:
        type: "ITEM_DISPLAY"
        item: "minecraft:stick"
        custom_model_data: 12001
        transform:
          offset: [0.0, 1.55, 0.25]
          rotation: [0.0, 0.0, 0.0]
          scale: [0.7, 0.7, 0.7]

