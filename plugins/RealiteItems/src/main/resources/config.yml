# Основной язык сообщений (ru/en)
lang: "ru"

items:
  # Обновлять названия/лоры ваших предметов при входе игрока
  refreshOnJoin: false

resourcePack:
  # Включить предложение/форсирование ресурспака при входе
  enabled: false
  # Ссылка на архив ресурспака
  url: ""
  # SHA1-хеш ресурспака (40 символов, без пробелов)
  sha1: ""
  # Обязательный ресурспак (игрок не сможет отказаться)
  required: false
  # Ключ сообщения-подсказки (messages_*.yml)
  promptMessageKey: "resource-pack.prompt"
