# Default limits for city plots
limits:
  defaultPlotsPerPlayer: 3

# Storage settings
storage:
  sqliteFile: "city.sqlite"

logging:
  debug: false

# Future city area behavior
cityArea:
  defaultDeny: true
  bypassPermission: "realite.city.bypass"

plots:
  types:
    home:
      enabled: true
    shop:
      enabled: true
