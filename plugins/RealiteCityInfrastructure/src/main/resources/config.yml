# Default limits for city plots
limits:
  defaultPlotsPerPlayer: 3
  perType:
    home: 3
    shop: 1

lang: "ru"  # Supported languages: "en", "ru"

# Storage settings
storage:
  sqliteFile: "city.sqlite"

logging:
  debug: false

# Access priority: Plot > CityRegion > outside
access:
  # Default decision when a point is outside any city region
  defaultOutsideCity: "ALLOW" # ALLOW | DENY

# Future city area behavior
cityArea:
  defaultDeny: true
  bypassPermission: "realite.city.bypass"

plots:
  # Plot has priority over city region access rules
  priority: "PLOT_OVER_CITY"
  # City plots must be completely inside city regions
  mustBeInsideCity: true
  # Overlapping plots are not allowed
  allowOverlap: false
  nearby:
    defaultRadius: 150
  types:
    home:
      enabled: true
    shop:
      enabled: true
  protection:
    allowInteractOutsideMembers: false
  guild:
    # Allow guild members to build on guild-owned plots
    allowBuildForMembers: true

    # Allow guild members to open doors/containers on guild-owned plots
    allowInteractForMembers: true
  cleanup:
    enabled: true
    blocksPerTick: 2000
    mode: "FLAT"
    fillBlock: "GRASS_BLOCK"
    clearAboveY: -1

shops:
  pointsPerPlot: 3
  rent:
    enabled: false
    periodHours: 24
    pricePerPeriod: 100
    graceHours: 48
    checkMinutes: 10
  marker:
    enabled: true
    formatLine1: "&e{title} &7({category})"
    formatLine2: "{status}"
    updateOnChange: true

market:
  nearby:
    defaultRadius: 150
  teleport:
    enabled: true
    permission: "realite.city.market.tp"
    cooldownSeconds: 30
    cost: 0
  hub:
    world: ""
    x: 0
    y: 0
    z: 0
