# Default limits for city plots
limits:
  defaultPlotsPerPlayer: 3

lang: "ru"  # Supported languages: "en", "ru"

# Storage settings
storage:
  sqliteFile: "city.sqlite"

logging:
  debug: false

# Future city area behavior
cityArea:
  defaultDeny: true
  bypassPermission: "realite.city.bypass"

plots:
  nearby:
    defaultRadius: 150
  types:
    home:
      enabled: true
    shop:
      enabled: true
  cleanup:
    enabled: true
    blocksPerTick: 2000
    mode: "AIR_ONLY"
