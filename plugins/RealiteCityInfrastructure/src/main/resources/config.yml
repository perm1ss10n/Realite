# Default limits for city plots
limits:
  defaultPlotsPerPlayer: 3

language: "ru"  # Supported languages: "en", "ru"

# Storage settings
storage:
  sqliteFile: "city.sqlite"

logging:
  debug: false

# Future city area behavior
cityArea:
  defaultDeny: true
  bupass.permissions: "realite.city.bypass"

plots:
  types:
    home:
      enabled: true
    shop:
      enabled: true