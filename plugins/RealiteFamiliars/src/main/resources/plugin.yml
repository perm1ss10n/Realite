name: RealiteFamiliars
version: 1.0.0
main: ru.realite.familiars.RealiteFamiliarsPlugin
api-version: "1.21"

depend:
  - RealiteCore
softdepend:
  - RealiteUI
  - RealiteItems

commands:
  familiars:
    description: "Familiar debug tools"
    usage: /familiars debug <typeId>
  familiar:
    description: "Summon or dismiss familiars"
    usage: /familiar <summon|dismiss|follow|stay|ui> [typeId]
