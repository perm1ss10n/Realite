name: RealiteGuilds
version: 0.1.0
main: ru.realite.guilds.RealiteGuildsPlugin
api-version: "1.21"

depend:
  - RealiteCore
softdepend:
  - RealiteCityInfrastructure

commands:
  g:
    description: Guild commands
    usage: /g <create|info|invite|join|leave|disband|ranks|setrank|sethome|home|tp|claim|salary|toggle|admin addxp>
    aliases: [guild]
