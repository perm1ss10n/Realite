# Основной язык сообщений (ru/en)
lang: "ru"

# Включение функционала плагина
features:
  # Приглашения в гильдии
  invites: true
  # Присоединение к гильдии
  join: true
  # Выход из гильдии
  leave: true
  # Роспуск гильдии
  disband: true

# Настройки рангов
ranks:
  # Разрешать больше одного лидера
  allowMultipleLeaders: false

# Настройки гильдий
guild:
  # Параметры тега гильдии
  tag:
    min: 2
    max: 5
    regex: "^[A-Z0-9_]+$"
  # Ограничения на название гильдии
  name:
    max: 24
  # Ограничения на количество участников
  members:
    max: 30

# Настройки приглашений
invites:
  # Время жизни приглашения в секундах
  ttlSeconds: 600
  # Требовать активное приглашение для входа
  requireInviteToJoin: true
  # Максимальное число активных приглашений для гильдии
  maxActiveInvitesPerGuild: 10

# Настройки выхода из гильдии
leave:
  # Перезарядка перед повторным выходом в секундах
  cooldownSeconds: 300
  # Запрещать выход владельцу гильдии
  denyIfLeader: true
