format:
  prefix: "&6[Гильдия]&r "

error:
  no_permission: "{prefix}&cНедостаточно прав."
  player_only: "{prefix}&cКоманда доступна только игрокам."
  player_not_found: "{prefix}&cИгрок не найден."
  guild:
    tag-exists: "{prefix}&cГильдия с таким тегом уже существует."
    tag-length: "{prefix}&cТег должен быть длиной от {min} до {max}."
    tag-regex: "{prefix}&cТег содержит недопустимые символы."
    name-length: "{prefix}&cНазвание не должно превышать {max} символов."
    name-empty: "{prefix}&cНазвание гильдии не может быть пустым."
    no_member: "{prefix}&cВы не состоите в гильдии."
    disband-disabled: "{prefix}&cРоспуск гильдий отключен."
    disband-not-owner: "{prefix}&cТолько владелец может распустить гильдию."

usage:
  root: "{prefix}&eИспользование: /g <создать|инфо|пригласить|вступить|покинуть|ранги|установитьранг|дом|установитьдом|телепорт|захват|зарплата|toggle>"
  create: "{prefix}&eИспользование: /g create <tag> <name...>"
  info: "{prefix}&eИспользование: /g info [tag]"
  invite: "{prefix}&eИспользование: /g invite <player>"
  join: "{prefix}&eИспользование: /g join <tag>"
  leave: "{prefix}&eИспользование: /g leave"
  ranks: "{prefix}&eИспользование: /g ranks"
  setrank: "{prefix}&eИспользование: /g setrank <player> <rankId>"
  tp: "{prefix}&eИспользование: /g tp <player>"
  claim: "{prefix}&eИспользование: /g claim <pos1|pos2|apply|clear>"
  toggle: "{prefix}&eИспользование: /g toggle"
  help: "{prefix}&eКоманды:\n&6/g create <tag> <name...>\n&6/g info [tag]\n&6/g invite <player>\n&6/g join <tag>\n&6/g leave\n&6/g ranks\n&6/g setrank <player> <rankId>\n&6/g home|sethome\n&6/g tp <player>\n&6/g claim pos1|pos2|apply|clear\n&6/g salary\n&6/g toggle"

admin:
  addxp:
    usage: "{prefix}&eИспользование: /g admin addxp <tag> <amount> [reason]"

success:
  create: "{prefix}&aГильдия &f[{tag}] {name}&a успешно создана!"
  disband: "{prefix}&aГильдия &f[{tag}]&a распущена."

info:
  format: "{prefix}&eГильдия &6[{tag}]&e {name} &7(владелец: {owner})"

guild:
  created: "{prefix}&aГильдия &f[{tag}] {name}&a создана."
  exists: "{prefix}&cГильдия с таким тегом уже существует."
  not_found: "{prefix}&cГильдия не найдена."

invite:
  sent: "{prefix}&aПриглашение отправлено игроку &f{player}&a."
  received: "{prefix}&eВы получили приглашение в гильдию &f[{tag}] {name}&e от &f{player}&e."
  expired: "{prefix}&cСрок действия приглашения истёк."
  none: "{prefix}&cУ вас нет активных приглашений."

join:
  success: "{prefix}&aВы вступили в гильдию &f[{tag}] {name}&a."
  denied:
    no_invite: "{prefix}&cДля вступления требуется приглашение."
    full: "{prefix}&cВ гильдии нет свободных мест."
  already_in_guild: "{prefix}&cВы уже состоите в гильдии."

leave:
  success: "{prefix}&aВы покинули гильдию &f[{tag}]&a."
  denied:
    leader: "{prefix}&cВладелец не может покинуть гильдию."
    cooldown: "{prefix}&cВы сможете покинуть гильдию через {seconds} сек."

rank:
  list:
    header: "{prefix}&eРанги гильдии:\n{list}"
  set:
    success: "{prefix}&aРанг игрока &f{player}&a изменен на &f{rank}&a."
    denied:
      higher_or_equal: "{prefix}&cНельзя назначить ранг выше или равный вашему."
      no_permission_flag: "{prefix}&cНедостаточно прав для изменения ранга."
  not_found: "{prefix}&cРанг не найден."
  name:
    leader: "Лидер"
    officer: "Офицер"
    member: "Участник"

home:
  set: "{prefix}&aГильдейский дом установлен."
  not_set: "{prefix}&cГильдейский дом не установлен."
  tp:
    start: "{prefix}&eТелепортация через {seconds} сек."
    cancelled: "{prefix}&cТелепортация отменена."
    success: "{prefix}&aТелепортация выполнена."
  denied: "{prefix}&cНедостаточно прав для дома."

tp:
  start: "{prefix}&eТелепортация через {seconds} сек."
  cancelled: "{prefix}&cТелепортация отменена."
  success: "{prefix}&aТелепортация выполнена."
  denied: "{prefix}&cНедостаточно прав для телепортации."
  cooldown: "{prefix}&cВы сможете телепортироваться через {seconds} сек."
  target:
    not_found: "{prefix}&cИгрок не найден."
    not_in_guild: "{prefix}&cИгрок не состоит в вашей гильдии."
    offline: "{prefix}&cИгрок сейчас не в сети."

claim:
  pos1: "{prefix}&aТочка 1 установлена: &f{loc}"
  pos2: "{prefix}&aТочка 2 установлена: &f{loc}"
  apply:
    success: "{prefix}&aТерритория гильдии установлена."
    denied:
      size: "{prefix}&cРазмер территории превышает лимит."
  clear: "{prefix}&aТерритория гильдии очищена."

access:
  denied: "{prefix}&cНет доступа к этому блоку."
  city:
    denied: "{prefix}&cНет доступа на территории города."

salary:
  info: "{prefix}&eЗарплата: &f{rate}&e, ранг: &f{rank}&e, следующий раз: &f{next}&e."
  paid: "{prefix}&aНачислено &f{amount}&a."
  disabled: "{prefix}&cЗарплата отключена."
  admin:
    run:
      start: "{prefix}&eЗапуск начисления зарплаты..."
      done: "{prefix}&aЗарплата начислена {count} игрок(ам) на сумму {total}."

chat:
  guild:
    toggle:
      enabled: "{prefix}&aГильдийский чат включен."
      disabled: "{prefix}&eГильдийский чат выключен."
      command_disabled: "{prefix}&cКоманда переключения чата отключена."
      no_permission: "{prefix}&cНедостаточно прав для переключения чата."

xp:
  added: "{prefix}&aГильдия &f[{tag}]&a получила &f{amount}&a XP. Всего: &f{total}&a, уровень: &f{level}&a. Причина: &f{reason}&a."
  levelup: "{prefix}&aГильдия &f[{tag}]&a достигла уровня &f{level}&a!"
